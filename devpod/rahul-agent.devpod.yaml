---
schema_version: 0
region: virginia
shell: zsh

repositories:
  - repo: git@github.uberinternal.com:rahul-tejwani_UBER/agent-config.git
    dest: /home/user/agent-config
    update: true

tasks:
  - name: Apply agent config
    command: /home/user/agent-config/setup.sh
    when: on-create,on-restart
